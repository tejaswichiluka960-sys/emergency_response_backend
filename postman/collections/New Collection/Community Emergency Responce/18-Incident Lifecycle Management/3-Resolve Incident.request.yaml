$kind: http-request
name: 3-Resolve Incident
url: '{{base_url}}/api/v1/incidents/{{incident_id}}/resolve/'
method: POST
headers:
  - key: Authorization
    value: Bearer {{responder_token}}
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "resolution": "{{resolution_note}}"
    }
order: 3000
