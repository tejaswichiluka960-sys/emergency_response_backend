$kind: http-request
name: "1-Update Location"
url: "{{base_url}}/api/v1/users/me/location/"
method: POST
headers:
  Authorization: Bearer {{resident_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "latitude": {{latitude}},
      "longitude": {{longitude}},
      "accuracy": {{accuracy}}
    }
order: 1
