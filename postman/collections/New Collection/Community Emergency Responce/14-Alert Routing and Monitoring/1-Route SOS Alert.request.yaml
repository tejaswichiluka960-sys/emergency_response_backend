$kind: http-request
name: "1-Route SOS Alert"
url: "{{base_url}}/api/v1/alert-routing/route-alert/"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "incident_id": "{{incident_id}}",
      "emergency_type": "{{emergency_type}}"
    }
order: 1
