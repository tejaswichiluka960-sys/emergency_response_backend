$kind: http-request
name: "4-Update Security Delivery"
url: "{{base_url}}/api/v1/alert-routing/routes/{{security_route_id}}/delivery/"
method: PATCH
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "delivery_status": "{{security_delivery_status}}"
    }
order: 4
