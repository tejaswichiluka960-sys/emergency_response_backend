$kind: http-request
name: "3-Update Guardian Delivery"
url: "{{base_url}}/api/v1/alert-routing/routes/{{guardian_route_id}}/delivery/"
method: PATCH
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "delivery_status": "{{guardian_delivery_status}}"
    }
order: 3
