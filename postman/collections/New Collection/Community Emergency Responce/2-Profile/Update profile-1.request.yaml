$kind: http-request
name: Update profile
description: Use an admin token and target_username to update any profile. The username identifies the target; email is updated. Use new_username only when renaming.
url: "{{base_url}}/api/v1/auth/profile/update/"
method: PUT
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "target_username": "{{target_username}}",
      "email": "{{shared_registration_email}}"
    }
order: 1
