$kind: http-request
name: "1-Create Flat"
url: '{{base_url}}/api/flats/'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
body:
  type: json
  content: |-
    {
      "flat_number": "{{flat_number}}",
      "owner_name": "{{flat_owner_name}}",
      "floor": {{flat_floor}},
      "society_name": "{{society_name}}"
    }
order: 1
