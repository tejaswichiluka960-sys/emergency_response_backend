$kind: http-request
name: "1-Send Email"
url: "{{base_url}}/api/v1/notifications/send-email/"
method: POST
headers:
  Authorization: Bearer {{resident_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{notification_email}}",
      "subject": "{{email_subject}}",
      "message": "{{email_message}}"
    }
order: 1
