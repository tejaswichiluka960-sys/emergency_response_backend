$kind: http-request
name: "1-Register"
description: "Register body template. Fill in the details in Postman before sending."
url: "{{base_url}}/api/v1/auth/register/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "",
      "email": "{{shared_registration_email}}",
      "phone": "",
      "password": ""
    }
order: 1
